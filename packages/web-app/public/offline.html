<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090a" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Daemon is unreachable · Kombinat</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        display: flex;
        min-height: 100dvh;
        margin: 0;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        background: #09090a;
        color: #ececee;
        font:
          14px/20px -apple-system,
          'Helvetica Neue',
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        display: flex;
        max-width: 22rem;
        padding: 24px;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
      }
      svg {
        width: 28px;
        height: 28px;
        margin-bottom: 4px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: #8b8b92;
      }
      button {
        height: 36px;
        margin-top: 8px;
        padding: 0 16px;
        border: 0;
        border-radius: 9999px;
        background: #ececee;
        color: #09090a;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      @media (width < 40rem) {
        body {
          font-size: 16px;
          line-height: 24px;
        }
        h1 {
          font-size: 18px;
          line-height: 24px;
        }
        button {
          height: 44px;
        }
      }
      button:focus-visible {
        outline: none;
        box-shadow:
          0 0 0 1px #09090a,
          0 0 0 3px rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
        <path
          d="M15.82 60H6.82A24 24 0 0 1 13.85 43.03L21.38 35.5V46.57A4 4 0 0 1 20.21 49.4A15 15 0 0 0 15.82 60Z"
        />
        <path
          d="M28.82 60H19.82A11 11 0 0 1 23.04 52.22L39.77 35.5V46.57A4 4 0 0 1 38.6 49.4L29.41 58.59A2 2 0 0 0 28.82 60Z"
        />
        <path d="M52.77 60H43.77V35.23A9 9 0 0 1 46.4 28.86L52.77 22.5Z" />
        <path d="M46.4 23.21A9 9 0 0 1 46.4 10.48L52.88 4L55.71 6.83A5 5 0 0 1 55.71 13.9Z" />
      </svg>
      <h1>Daemon is unreachable</h1>
      <p>
        The computer that runs Kombinat may be asleep or offline, or the daemon has stopped. The
        dashboard opens by itself once it answers.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      const RETRY_MS = 3000;
      const reloadIfUp = async () => {
        if (document.hidden) return;
        try {
          const response = await fetch('/api/status', { cache: 'no-store' });
          if (response.ok) location.reload();
        } catch {}
      };
      setInterval(reloadIfUp, RETRY_MS);
      addEventListener('online', reloadIfUp);
    </script>
  </body>
</html>
